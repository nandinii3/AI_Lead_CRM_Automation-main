services:
  app:
    build: .
    container_name: ai_lead_crm_app
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    networks:
      - lead_crm_network

  n8n:
    image: n8nio/n8n:latest
    container_name: ai_lead_crm_n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      TZ: Europe/Warsaw
      N8N_SECURE_COOKIE: "false"
    restart: unless-stopped
    networks:
      - lead_crm_network

volumes:
  n8n_data:

networks:
  lead_crm_network:
    driver: bridge
